# Run from backend-node. Never combine this location with the MySQL history.
flyway.locations=filesystem:db/postgresql/migration
flyway.schemas=public
flyway.defaultSchema=public
flyway.cleanDisabled=true
flyway.baselineOnMigrate=false
flyway.validateMigrationNaming=true
flyway.initSql=SET TIME ZONE 'UTC'
# Supply FLYWAY_URL, FLYWAY_USER and FLYWAY_PASSWORD through your environment.
